name: Release

# Push a tag like v1.2.0 and this builds the card and publishes a GitHub release with it attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build with the tag's version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const f='package.json';const p=require('./'+f);p.version='$VERSION';require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          node build.mjs
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/ha-messenger-card.js \
            --title "HA Messenger $GITHUB_REF_NAME" --generate-notes
